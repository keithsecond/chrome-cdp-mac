[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:chromium]
command=/usr/local/bin/start-chrome.sh
user=chrome
environment=HOME="/home/chrome",DISPLAY="%(ENV_DISPLAY)s",USER="chrome"
autostart=true
autorestart=true
startsecs=10
stdout_logfile=/var/log/supervisor/chrome.log
stderr_logfile=/var/log/supervisor/chrome.err
priority=10

[program:socat-debug]
command=/usr/bin/socat TCP-LISTEN:9222,fork,reuseaddr TCP:127.0.0.1:9223
autostart=true
autorestart=true
startsecs=2
stdout_logfile=/var/log/supervisor/socat.log
stderr_logfile=/var/log/supervisor/socat.err
priority=20
